background_opacity 0.68
dynamic_background_opacity yes
window_padding_width 12

font_family JetBrainsMono Nerd Font
font_size 7

foreground #D9E0EE
background #1E1E2E
selection_foreground #1E1E2E
selection_background #F5C2E7
cursor #F5E0DC

color0  #1E1E2E
color1  #F38BA8
color2  #a1b4e3
color3  #F9E2AF
color4  #89B4FA
color5  #CBA6F7
color6  #94E2D5
color7  #BAC2DE
color8  #585B70
color9  #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #89B4FA
color13 #CBA6F7
color14 #94E2D5
color15 #A6ADC8

cursor_shape block
cursor_beam_thickness 1.5

tab_bar_style powerline
mouse_hide_wait 2.0

# Run fastfetch every time a new shell starts.
# This uses the shell startup instead of the unsupported startup_command option.
shell bash --login -c 'fastfetch; exec bash --login -i'

# Close without prompting if bash is still running
#confirm_os_window_close 0
